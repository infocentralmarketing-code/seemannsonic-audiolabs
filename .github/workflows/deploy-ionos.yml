name: SeemannSonic - IONOS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Wartungsmodus pruefen
        id: maintenance
        run: |
          MODE=$(tr -d '[:space:]' < maintenance-mode.txt)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Normale Webseite vorbereiten
        if: steps.maintenance.outputs.mode == 'OFF'
        run: |
          mkdir -p deploy
          cp index.html deploy/index.html
          cp copy.json deploy/copy.json
          cp -r assets deploy/assets

      - name: Wartungsseite vorbereiten
        if: steps.maintenance.outputs.mode == 'ON'
        run: |
          mkdir -p deploy
          cp maintenance.html deploy/index.html

      - name: SFTP Werkzeug installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Zu IONOS uebertragen
        env:
          SSHPASS: ${{ secrets.IONOS_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -P 22 -r deploy/* "${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }}:./"
