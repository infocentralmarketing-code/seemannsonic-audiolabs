name: SeemannSonic - IONOS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Deployment vorbereiten
        run: |
          mkdir -p deploy
          cp index.html deploy/index.html
          cp landing.html deploy/landing.html
          cp maintenance.html deploy/maintenance.html
          cp maintenance-mode.txt deploy/maintenance-mode.txt
          cp copy.json deploy/copy.json
          cp -r assets deploy/assets

      - name: SFTP Werkzeug installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Zu IONOS uebertragen
        env:
          SSHPASS: ${{ secrets.IONOS_PASSWORD }}
        run: |
          printf "put -r deploy/*\nbye\n" | sshpass -e sftp -o StrictHostKeyChecking=no -P 22 "${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }}"
