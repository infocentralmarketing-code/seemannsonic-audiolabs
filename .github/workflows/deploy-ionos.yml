name: SeemannSonic – IONOS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Wartungsmodus prüfen
        id: maintenance
        run: |
          MODE=$(tr -d '[:space:]' < maintenance-mode.txt)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Normale Webseite vorbereiten
        if: steps.maintenance.outputs.mode == 'OFF'
        run: |
          mkdir deploy
          cp index.html deploy/index.html
          cp copy.json deploy/copy.json
          cp -r assets deploy/assets

      - name: Wartungsseite vorbereiten
        if: steps.maintenance.outputs.mode == 'ON'
        run: |
          mkdir deploy
          cp maintenance.html deploy/index.html

           - name: Zu IONOS übertragen
        env:
          SSHPASS: ${{ secrets.IONOS_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          sshpass -e sftp -o StrictHostKeyChecking=no -P 22 ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }} <<'EOF'
          put -r deploy/*
          bye
          EOF
