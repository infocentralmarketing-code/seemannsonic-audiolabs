<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeemannSonic</title>
</head>
<body>
<script>
fetch('maintenance-mode.txt?t=' + Date.now(), { cache: 'no-store' })
  .then(response => response.text())
  .then(mode => {
    if (mode.trim().toUpperCase() === 'ON') {
      window.location.replace('maintenance.html');
    } else {
      window.location.replace('landing.html');
    }
  })
  .catch(() => {
    window.location.replace('landing.html');
  });
</script>
</body>
</html>
